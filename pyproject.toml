[project]
name = "RAG"
version = "0.1.0"
requires-python = ">= 3.10"
dependencies = [
  "pydantic>=2",
  "bm25s",
  "pypdf>=6.10.2",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "textual",
  "tqdm",
]

[dependency-groups]
dev = ["flake8", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
