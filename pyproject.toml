[project]
name = "RAG"
version = "0.1.0"
requires-python = ">= 3.10"
dependencies = [
  "pydantic>=2",
  "bm25s",
  "pypdf>=6.10.2",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "tqdm",
  "pystemmer>=3.1.0",
  "fire>=0.7.1",
  "qdrant-client>=1.20.0",
  "fastembed",
  "openai>=3.51.0",
  "ollama>=0.6.3",
  "rich>=13.7",
]

[dependency-groups]
dev = ["flake8", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
